# Full tests for same-repository staging -> main PRs.
name: test
# The host matches deployment runs by name. Metadata edits must not shadow or cancel them.
run-name: >-
  ${{ (github.event.action != 'edited' || github.event.changes.base.ref.from) &&
      format('test PR #{0} at {1}', github.event.pull_request.number, github.sha) || 'PR metadata edited' }}
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.action == 'edited' && !github.event.changes.base.ref.from && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  deployment-pr:
    if: >-
      github.head_ref == 'staging' && github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.head.outputs.eligible }}
    steps:
      - name: Match the exact deployment branches
        id: head
        # Actions compares strings case-insensitively, while Git refs are case-sensitive.
        run: |
          if [ "$GITHUB_HEAD_REF" = staging ] && [ "$GITHUB_BASE_REF" = main ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
  oss-check:
    needs: deployment-pr
    if: needs.deployment-pr.outputs.eligible == 'true'
    # TP-184: no personal or company names, home paths or token-shaped strings in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/oss-check.sh
  unit:
    needs: deployment-pr
    if: needs.deployment-pr.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # runs the .ts check directly
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: skip reverse DNS in Python
        # socket.getfqdn('127.0.0.1') takes 35s on macos-latest and http.server calls it on every bind;
        # sitecustomize reaches the servers the tests start as subprocesses too
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          echo 'import socket; socket.getfqdn = lambda name="": name or socket.gethostname()' > "$RUNNER_TEMP/site/sitecustomize.py"
          echo "PYTHONPATH=$RUNNER_TEMP/site" >> "$GITHUB_ENV"
      - name: python -m unittest (test files in parallel)
        # the tests mostly wait on subprocesses and git; serial runs took ~10 min on macos-latest.
        # test_devserver / test_worktree_dev free a probed port and bind it again, so they run alone afterwards.
        run: |
          ls tests/test_*.py | xargs -n1 basename | grep -vxE 'test_(devserver|worktree_dev)\.py' | xargs -P 4 -n1 sh -c \
            's=$(date +%s); python -m unittest discover tests -p "$1" >"$RUNNER_TEMP/$1.log" 2>&1; r=$?; echo "$1: $(($(date +%s)-s))s"; [ $r = 0 ] || { cat "$RUNNER_TEMP/$1.log"; exit 1; }' sh
          python -m unittest discover tests -p 'test_devserver.py'
          python -m unittest discover tests -p 'test_worktree_dev.py'
      - name: web build and check
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build && npm run check
  docker:
    needs: deployment-pr
    if: needs.deployment-pr.outputs.eligible == 'true'
    # TP-164: the image builds, refuses to start without TP_ADMINS / TP_ORG, and asks every visitor to log in
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: compose files are valid (TP-166 tunnel profile included)
        run: docker compose -f docker/compose.yaml --profile tunnel config -q
      - name: build
        run: docker build -f docker/Dockerfile -t ticket-pilot:ci .
      - name: no TP_ADMINS, no TP_ORG -> does not start
        run: |
          if out=$(docker run --rm -e TP_ADMINS= -e TP_ORG= ticket-pilot:ci 2>&1); then echo "started: $out"; exit 1; fi
          echo "$out" | grep TP_ADMINS
      - name: /api/state needs a login; tp and claude run
        run: |
          docker run -d --name tp -e TP_ADMINS=ci-admin -p 127.0.0.1:3032:3032 ticket-pilot:ci
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:3032/api/lan/me && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3032/api/state)
          [ "$code" = 401 ] || { echo "/api/state: $code"; docker logs tp; exit 1; }
          docker exec tp tp --help >/dev/null
          docker exec tp claude --version
          docker stop tp
          docker logs tp 2>&1 | grep "tp run: stopped"
      - name: update button replaces tp and rolls back a failed image
        run: PYTHONPATH=. python3 tests/docker_update_integration.py
  mode:
    needs: deployment-pr
    if: needs.deployment-pr.outputs.eligible == 'true'
    # TP-165: a host install -> tp mode docker --apply -> the container sees the DB and the worktree folder at the same
    # path -> tp mode host --apply brings the DB back (no systemd units on the runner: the service steps are skipped)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: a host install
        run: |
          mkdir -p "$RUNNER_TEMP/wt" && echo hi > "$RUNNER_TEMP/wt/marker"
          bin/tp config set global.worktree_root "\"$RUNNER_TEMP/wt\""
          bin/tp config set global.owner_name '"ci-marker"'
          bin/tp mode
      - name: preview changes nothing
        run: |
          bin/tp mode docker --admins ci-admin
          test ! -e docker/compose.override.yaml && test ! -e ~/tp-work/mode-state.json
      - name: tp mode docker --apply
        run: bin/tp mode docker --apply --admins ci-admin
      - name: the container has the DB and the worktree folder
        working-directory: docker
        run: |
          docker compose exec -T tp tp config get global.owner_name | grep ci-marker
          docker compose exec -T tp cat "$RUNNER_TEMP/wt/marker" | grep hi
          docker compose exec -T tp tp config set global.owner_name '"from-docker"'
          test ! -w ../data/tp.db
      - name: tp mode host --apply
        run: |
          bin/tp mode host --apply
          bin/tp config get global.owner_name | grep from-docker
          test -w data/tp.db
      - if: failure()
        working-directory: docker
        run: docker compose logs tp || true; cat ~/tp-work/mode-state.json || true

  deployment-tests-passed:
    # Metadata-only edits must not replace the required check for this commit.
    name: ${{ (github.event.action != 'edited' || github.event.changes.base.ref.from) && 'deployment-tests-passed' || 'deployment-tests-metadata-edit' }}
    # GitHub accepts a skipped job as a required check. Skip only for PRs outside the deployment scope.
    if: >-
      always() && (github.event.action != 'edited' || github.event.changes.base.ref.from) &&
      needs.deployment-pr.result != 'skipped' &&
      (needs.deployment-pr.result != 'success' || needs.deployment-pr.outputs.eligible != 'false')
    needs: [deployment-pr, oss-check, unit, docker, mode]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require every deployment test to pass
        env:
          ELIGIBLE: ${{ needs.deployment-pr.result == 'success' && needs.deployment-pr.outputs.eligible }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$ELIGIBLE" != true ]; then
            echo '::error::Could not confirm deployment PR eligibility.'
            exit 1
          fi
          # Check both matrix jobs individually. Keep successful jobs from earlier attempts when rerunning failures.
          missing=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" |
            jq -r '
              [.[].jobs[]] | group_by(.name) | map(max_by(.run_attempt)) |
              map(select(.status == "completed" and .conclusion == "success") | .name) as $passed |
              ["oss-check", "unit (ubuntu-latest)", "unit (macos-latest)", "docker", "mode"] - $passed | join(", ")
            ')
          if [ -n "$missing" ]; then
            echo "::error::Deployment tests without a successful result: $missing"
            exit 1
          fi
