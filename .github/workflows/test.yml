# TEMPORARY diagnostic branch: never merge.
name: test
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: time name lookups (before)
        run: &probe |
          hostname
          python - <<'PY'
          import socket, time, http.server
          def t(label, f):
              s = time.monotonic()
              try: r = f()
              except Exception as e: r = repr(e)
              print(f'{time.monotonic()-s:6.2f}s  {label} -> {r}')
          t('gethostname', socket.gethostname)
          t("getfqdn('127.0.0.1')", lambda: socket.getfqdn('127.0.0.1'))
          t("getfqdn('')", lambda: socket.getfqdn(''))
          t("getfqdn('0.0.0.0')", lambda: socket.getfqdn('0.0.0.0'))
          t('HTTPServer bind 127.0.0.1:0', lambda: http.server.HTTPServer(('127.0.0.1', 0), http.server.BaseHTTPRequestHandler).server_close())
          PY
      - name: add hostname to /etc/hosts
        run: echo "127.0.0.1 $(hostname) $(hostname -s)" | sudo tee -a /etc/hosts
      - name: time name lookups (after)
        run: *probe
      - name: slow files after the hosts fix
        run: |
          python -m unittest discover tests -p test_worktree_dev.py 2>&1 | tail -3
          python -m unittest discover tests -p test_devserver.py 2>&1 | tail -3
          python -m unittest discover tests -p test_lan.py 2>&1 | tail -3
