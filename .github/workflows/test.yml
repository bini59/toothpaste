# TEMPORARY diagnostic branch: never merge. Times lsof/ps and the slow dev-server tests on macos-latest.
name: test
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: time lsof / ps
        run: |
          sysctl -n hw.ncpu; ps -A | wc -l
          touch /tmp/x.log
          for c in "lsof -t -- /tmp/x.log" "lsof -nP -iTCP:12345 -sTCP:LISTEN -Fp" "lsof -a -p $$ -d cwd -Fn" "ps -A -o pid=,pgid=,stat=" "ps -ww -p $$ -o args="; do
            s=$(python -c 'import time;print(time.time())'); $c >/dev/null || true; e=$(python -c 'import time;print(time.time())')
            python -c "print(f'{$e-$s:6.2f}s  $c')"
          done
      - name: slow files with durations
        run: |
          python -X importtime -c 'pass' 2>/dev/null
          python -m unittest discover tests -p test_worktree_dev.py --durations 0
          python -m unittest discover tests -p test_devserver.py --durations 10
      - name: count subprocess calls in test_worktree_dev
        run: |
          python - <<'PY'
          import collections, subprocess, sys, time, unittest
          stats = collections.defaultdict(lambda: [0, 0.0])
          orig = subprocess.Popen.__init__
          def init(self, args, *a, **k):
              s = time.monotonic(); orig(self, args, *a, **k)
              name = (args[0] if isinstance(args, (list, tuple)) else str(args).split()[0]).rsplit('/', 1)[-1]
              self._diag = (name, s)
          orig_wait = subprocess.Popen.wait
          def wait(self, *a, **k):
              r = orig_wait(self, *a, **k)
              d = getattr(self, '_diag', None)
              if d:
                  stats[d[0]][0] += 1; stats[d[0]][1] += time.monotonic() - d[1]; self._diag = None
              return r
          subprocess.Popen.__init__ = init; subprocess.Popen.wait = wait
          sys.path.insert(0, 'tests')
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_worktree_dev.py')
          unittest.TextTestRunner(verbosity=0).run(suite)
          for k, (n, t) in sorted(stats.items(), key=lambda x: -x[1][1]):
              print(f'{k:20} calls={n:5} total={t:7.1f}s')
          PY
