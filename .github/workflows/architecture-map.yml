name: architecture-map
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: architecture-map-${{ github.event.action == 'edited' && !github.event.changes.base.ref.from && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  architecture-map:
    # A metadata edit should neither cancel a check nor replace its result.
    name: ${{ (github.event.action != 'edited' || github.event.changes.base.ref.from) && 'architecture-map' || 'architecture-map-metadata-edit' }}
    if: github.event.action != 'edited' || github.event.changes.base.ref.from
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # include both PR merge parents and their common history
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check architecture map update
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_architecture_map.py "$PR_BASE" "$PR_HEAD"
