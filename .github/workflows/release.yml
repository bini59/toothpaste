# Publish verified staging -> main PR merges in the public repository. Manual runs use the selected main commit.
name: release
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "vX.Y.Z (empty = bump the last tag by the merged PR's label)"
        required: false
        default: ""
permissions: {}
jobs:
  verify:
    if: >-
      github.repository == 'bini59/toothpaste' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.merged == true &&
         github.event.pull_request.head.ref == 'staging' &&
         github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha || steps.manual.outputs.sha }}
    steps:
      - name: Select the main commit for a manual release
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Verify the test result for the merged PR
        id: verify
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m ticket_pilot.release_checks

  release:
    needs: verify
    if: needs.verify.outputs.sha != ''
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      pull-requests: read  # the merged PR's labels
    env:
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web/dist (attached as web-dist.tar.gz)
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: resolve release version
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag=$(bin/tp release-tag --sha "$SHA" --repo "$GITHUB_REPOSITORY" --print-version ${VERSION:+--version "$VERSION"})
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: publish release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/bini59/toothpaste:${{ steps.image.outputs.tag }}
          build-args: TP_RELEASE_VERSION=${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
      - name: tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.image.outputs.tag }}
        run: bin/tp release-tag --sha "$SHA" --repo "$GITHUB_REPOSITORY" --version "$VERSION"
